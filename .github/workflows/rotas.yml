name: Verificar rotas com ADS-B

# Fila própria, separada da publicação do site: a verificação leva ~25 min (3 fotos com 10 min
# de intervalo) e não pode atrasar o METAR nem os ciclones. O resultado fica no repositório
# (verificacao.json) e entra no site na próxima publicação, em até 30 min.
on:
  schedule:
    - cron: "0 3 * * *"   # meia-noite de Brasília (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotas
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar as rotas com ADS-B
        run: node scripts/rotas.mjs index.html verificacao.json verificacao.json https://lopesimulations.github.io/skyconnections/verificacao.json

      - name: Guardar a verificação no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verificacao.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "verificação noturna das rotas (ADS-B)"
          git pull --rebase
          git push
