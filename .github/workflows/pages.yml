name: Publicar site com METAR e verificação das rotas

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # a cada 30 min (o GitHub pode atrasar alguns minutos)
    - cron: "0 3 * * *"      # meia-noite de Brasília: verificação das rotas com ADS-B
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html i18n.js favicon.png fonts.css fonts lib _site/

      - name: Baixar METAR de hubs e destinos
        continue-on-error: true   # sem METAR o site ainda publica e usa o clima salvo na base
        run: node scripts/metar.mjs index.html _site/metar.json

      - name: Baixar ciclones tropicais ativos (GDACS)
        continue-on-error: true   # sem o arquivo o site só não mostra os ciclones
        timeout-minutes: 25
        run: node scripts/ciclones.mjs _site/ciclones.json https://lopesimulations.github.io/cargoconnections/ciclones.json

      - name: Verificar as rotas com ADS-B (meia-noite de Brasília)
        if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true   # se as fontes falharem, mantém a verificação da noite anterior
        timeout-minutes: 45
        run: node scripts/rotas.mjs index.html _site/verificacao.json https://lopesimulations.github.io/cargoconnections/verificacao.json

      - name: Manter a última verificação das rotas
        if: hashFiles('_site/verificacao.json') == ''
        continue-on-error: true
        run: curl -fsS -o _site/verificacao.json https://lopesimulations.github.io/cargoconnections/verificacao.json || rm -f _site/verificacao.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
