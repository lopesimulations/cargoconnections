name: Publicar site com METAR

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # a cada 30 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html i18n.js pax.json mundo.json fotos.json favicon.png fonts.css fonts lib _site/
          if [ -f verificacao.json ]; then cp verificacao.json _site/; fi   # gerado à meia-noite por rotas.yml

      - name: Baixar METAR de hubs e destinos
        continue-on-error: true   # sem METAR o site ainda publica e usa o clima salvo na base
        run: node scripts/metar.mjs index.html _site/metar.json

      - name: Verificação ADS-B de passageiros (ramo dados-pax)
        continue-on-error: true   # sem o arquivo o Pax só não mostra aeronave nem dias vistos
        run: git fetch --depth=1 origin dados-pax && git show FETCH_HEAD:verificacao-pax.json > _site/verificacao-pax.json

      - name: Baixar METAR dos hubs e destinos de passageiros
        continue-on-error: true   # arquivo à parte: não interfere no METAR da versão de carga
        run: node scripts/metar.mjs pax.json _site/metar-pax.json

      - name: Baixar ciclones tropicais ativos (GDACS)
        continue-on-error: true   # sem o arquivo o site só não mostra os ciclones
        timeout-minutes: 7         # o script tem prazo de 5 min; GDACS lento não segura a publicação
        run: node scripts/ciclones.mjs _site/ciclones.json https://lopesimulations.github.io/skyconnections/ciclones.json

      - name: Manter os últimos ciclones publicados
        if: hashFiles('_site/ciclones.json') == ''
        continue-on-error: true
        run: curl -fsS -o _site/ciclones.json https://lopesimulations.github.io/skyconnections/ciclones.json || rm -f _site/ciclones.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
